name: Code Quality

on:
  push:
    branches: [ android, develop ]
  pull_request:
    branches: [ android, develop ]

jobs:
  ktlint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: >-
          platforms;android-33
          build-tools;33.0.2
          platform-tools
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Run ktlint
      uses: ScaCap/action-ktlint@v1.26.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        reporter: github-check
        fail_on_error: true
        
  detekt:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: >-
          platforms;android-33
          build-tools;33.0.2
          platform-tools
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Check if detekt is enabled
      id: check_detekt
      run: |
        if grep -q "^[[:space:]]*id 'io.gitlab.arturbosch.detekt'" app/build.gradle; then
          echo "enabled=true" >> $GITHUB_OUTPUT
        else
          echo "enabled=false" >> $GITHUB_OUTPUT
        fi
      
    - name: Run detekt
      if: steps.check_detekt.outputs.enabled == 'true'
      run: ./gradlew detekt
      
    - name: Skip detekt (disabled)
      if: steps.check_detekt.outputs.enabled == 'false'
      run: echo "Detekt is disabled in build.gradle - skipping static analysis"
      
    - name: Upload detekt results
      if: always() && steps.check_detekt.outputs.enabled == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: detekt-results
        path: app/build/reports/detekt/
